/* ---------- rows ---------- */
function metaFor(t, { day = false, time = true } = {}) {
  const m = [];
  const late = !t.done && t.day && t.day < today();
  if (late) m.push(`<span class="late">${t.day === keyOf(addDays(new Date(), -1)) ? "من أمس" : "متأخرة من " + esc(fmtK(t.day, { day: "numeric", month: "long" }))}</span>`);
  else if (day && t.day) m.push(`<span>${esc(dayLabel(t.day))}</span>`);
  if (time && t.time) m.push(`<span class="num">${I.clock}${esc(fmtT(t.time))}</span>`);
  if (t.list) m.push(`<span><i class="dot" style="--c:var(--c-${t.list})"></i>${LISTS[t.list]}</span>`);
  if (t.remind != null && t.time) m.push(`<span class="bell">${I.bell}${esc(REMINDS.find(r => r[0] === t.remind)[1])}</span>`);
  if (t.note) m.push(`<span>${esc(t.note)}</span>`);
  return m.length ? `<span class="meta">${m.join("")}</span>` : "";
}
const checkBtn = t => `<button type="button" class="check" role="checkbox" aria-checked="${!!t.done}" aria-label="${esc(t.title)}" data-act="toggle"><span class="check__box">${I.check}</span></button>`;
function row(t, o = {}) {
  const late = !t.done && t.day && t.day < today();
  return `<li class="row${t.done ? " is-done" : ""}${late ? " late-row" : ""}" data-id="${t.id}">${checkBtn(t)}<button type="button" class="body" data-act="edit"><span class="body__title">${esc(t.title)}</span>${metaFor(t, o)}</button><span class="trail">${t.prio ? '<i class="prio" title="مهمة"></i>' : ""}</span></li>`;
}
function ev(t) {
  const nowM = new Date().getHours() * 60 + new Date().getMinutes();
  const isNow = t.day === today() && !t.done && nowM >= mins(t.time) && nowM < mins(t.time) + (t.dur || 30);
  return `<li class="ev${t.done ? " is-done" : ""}${isNow ? " is-now" : ""}" data-id="${t.id}" style="--c:var(--c-${t.list || "personal"})">
    <div class="ev__time"><b>${esc(fmtClock(t.time))}</b><small>${esc(fmtClock(endT(t.time, t.dur)))}</small></div>
    <div class="ev__card">${checkBtn(t)}<button type="button" class="body" data-act="edit"><span class="body__title">${esc(t.title)}</span>${metaFor(t, { time: false })}</button><span></span></div>
  </li>`;
}
function section(title, inner, { count, aside, id } = {}) {
  return `<section class="section"${id ? ` id="${id}"` : ""}><div class="section__head"><h2 class="section__title">${title}</h2>${count ? `<span class="section__count num">${N(count)}</span>` : ""}${aside ? `<span class="section__aside">${aside}</span>` : ""}</div>${inner}</section>`;
}
function emptyArt() {
  return `<svg class="empty__art" viewBox="0 0 160 112" fill="none" aria-hidden="true">
    <rect x="30" y="14" width="100" height="84" rx="14" fill="var(--surface-2)"/>
    <rect x="30" y="14" width="100" height="22" rx="11" fill="var(--accent)"/><rect x="30" y="26" width="100" height="10" fill="var(--accent)"/>
    <path d="M62 66 74 77 98 53" stroke="var(--text)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="130" cy="16" r="10" fill="var(--remind)" stroke="var(--surface)" stroke-width="4"/>
  </svg>`;
}

/* ---------- today ---------- */
function ribbon(k, items) {
  const S0 = 6 * 60, S1 = 24 * 60, span = S1 - S0;
  const pos = m => Math.max(0, Math.min(100, ((m - S0) / span) * 100));
  const blocks = items.filter(t => t.time).map(t => { const a = mins(t.time), b = a + (t.dur || 30); return `<button type="button" class="blk${t.done ? " is-done" : ""}" data-id="${t.id}" data-act="edit" style="--c:var(--c-${t.list || "personal"});inset-inline-start:${pos(a)}%;width:${Math.max(1.2, pos(b) - pos(a))}%" aria-label="${esc(t.title)} ${esc(fmtT(t.time))}"></button>`; }).join("");
  const n = new Date(); const nm = n.getHours() * 60 + n.getMinutes();
  const now = k === today() && nm >= S0 && nm <= S1 ? `<i class="now" style="inset-inline-start:${pos(nm)}%"></i>` : "";
  const hours = [6, 9, 12, 15, 18, 21, 24].map(h => `<span>${N(((h + 11) % 12) + 1)}</span>`).join("");
  const timed = items.filter(t => t.time && !t.done);
  const next = timed.find(t => mins(t.time) + (t.dur || 30) > nm);
  return `<div class="ribbon" aria-label="يومك من ٦ص إلى ١٢م"><div class="ribbon__head"><b>${k === today() ? "يومك" : esc(dayLabel(k))}</b><span class="num">${next && k === today() ? `التالي ${esc(fmtT(next.time))} · ${esc(next.title)}` : timed.length ? tasksW(timed.length) + " بوقت" : "ما فيه مواعيد"}</span></div>
    <div class="ribbon__track" style="--past:${k === today() ? pos(nm) : 0}%">${blocks}${now}</div><div class="ribbon__hours num">${hours}</div></div>`;
}
function renderToday() {
  const el = $("#view-today"), k = today();
  const items = onDay(k).sort(byTime);
  const late = lateOpen().sort(byTime);
  const open = items.filter(t => !t.done);
  const timed = items.filter(t => t.time);
  const untimed = items.filter(t => !t.time && !t.done);
  const done = doneToday();
  const reminders = upcomingReminders(k);
  if (!items.length && !late.length && !done.length) {
    el.innerHTML = ribbon(k, []) + `<div class="empty">${emptyArt()}<h2 class="empty__title">ما عندك شيء اليوم</h2><p class="empty__text">المهام والمواعيد تظهر هنا مع وقتها وتذكيرها.</p><button type="button" class="btn btn--primary" data-act="new-task">${I.plusSm}إضافة مهمة</button></div>`;
    return;
  }
  const total = open.length + late.length + done.length;
  let h = `<div class="stats">
    <button type="button" class="stat" data-view="tasks"><span class="stat__n num">${N(open.length + late.length)}<small>/ ${N(total)}</small></span><span class="stat__l">مهام باقية</span></button>
    <a class="stat" href="#calendar" style="text-decoration:none;color:inherit"><span class="stat__n num">${N(timed.length)}</span><span class="stat__l">${I.clock}مواعيد اليوم</span></a>
    <div class="stat stat--remind"><span class="stat__n num">${N(reminders.length)}</span><span class="stat__l">${I.bell}تذكيرات</span></div>
  </div>`;
  h += ribbon(k, items);
  if (late.length) h += section("متأخرة", `<ul class="list">${late.map(t => row(t, { day: false })).join("")}</ul>`, { count: late.length, aside: "انتقلت لليوم" });
  if (timed.length) h += section("الجدول", `<ul class="agenda">${timed.map(ev).join("")}</ul>`, { count: timed.length });
  if (untimed.length) h += section("مهام بدون وقت", `<ul class="list">${untimed.map(t => row(t)).join("")}</ul>`, { count: untimed.length });
  const doneUntimed = done.filter(t => !t.time || t.day !== k);
  if (doneUntimed.length) h += `<section class="section"><button type="button" class="disclosure" data-act="showdone" aria-expanded="${showDone}">${I.chev}<span>المنجزة (${N(doneUntimed.length)})</span></button>${showDone ? `<ul class="list">${doneUntimed.map(t => row(t)).join("")}</ul>` : ""}</section>`;
  el.innerHTML = h;
}

/* ---------- calendar ---------- */
function monthGrid(month, { mini = false } = {}) {
  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const start = addDays(first, -first.getDay());
  const sel = calSel || today();
  const dow = Array.from({ length: 7 }, (_, i) => `<span class="cal__dow">${fmt(addDays(start, i), { weekday: mini || innerWidth < 700 ? "narrow" : "short" })}</span>`).join("");
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), k = keyOf(d);
    if (i >= 35 && d.getMonth() !== month.getMonth()) break;
    const its = onDay(k).filter(t => !t.done);
    const lists = [...new Set(its.map(t => t.list))].slice(0, 3);
    cells += `<button type="button" class="day${d.getMonth() !== month.getMonth() ? " is-out" : ""}${k === today() ? " is-today" : ""}" data-day="${k}" aria-pressed="${k === sel}" aria-label="${esc(fmtK(k, { weekday: "long", day: "numeric", month: "long" }))}${its.length ? "، " + tasksW(its.length) : ""}"><span class="day__n">${N(d.getDate())}</span><span class="day__dots">${lists.map(l => `<i style="--c:var(--c-${l})"></i>`).join("")}</span></button>`;
  }
  return `<div class="cal${mini ? " cal--mini" : ""}"><div class="cal__head"><span class="cal__month">${fmt(month, { month: "long" })}<small class="num">${fmt(month, { year: "numeric" })}</small></span><span class="cal__nav"><button type="button" class="icon-btn icon-btn--sm" data-act="cal-prev" aria-label="الشهر السابق">${I.prev}</button><button type="button" class="icon-btn icon-btn--sm" data-act="cal-today" aria-label="اليوم">${I.today.replace('width="24" height="24"', 'width="16" height="16"')}</button><button type="button" class="icon-btn icon-btn--sm" data-act="cal-next" aria-label="الشهر التالي">${I.next}</button></span></div><div class="cal__grid num">${dow}${cells}</div></div>`;
}
function dayAgenda(k) {
  const its = onDay(k).sort(byTime);
  const timed = its.filter(t => t.time), rest = its.filter(t => !t.time);
  let h = `<div class="section__head"><h2 class="section__title">${esc(fmtK(k, { weekday: "long", day: "numeric", month: "long" }))}</h2><button type="button" class="link" data-act="new-task" data-day="${k}" style="margin-inline-start:auto">+ إضافة</button></div>`;
  if (!its.length) return `<section class="section">${h}<div class="empty empty--flat"><p class="empty__text">ما فيه شيء في هذا اليوم.</p></div></section>`;
  if (timed.length) h += `<ul class="agenda">${timed.map(ev).join("")}</ul>`;
  if (rest.length) h += `<ul class="list">${rest.map(t => row(t)).join("")}</ul>`;
  return `<section class="section">${h}</section>`;
}
function renderCalendar() {
  const k = calSel || today();
  $("#view-calendar").innerHTML = `<div class="calwrap">${monthGrid(calMonth)}${dayAgenda(k)}</div>`;
}

/* ---------- tasks ---------- */
function renderTasks() {
  const el = $("#view-tasks");
  const pool = S.tasks.filter(t => listFilter === "all" || t.list === listFilter);
  const chips = `<div class="chips chips--scroll" role="group" aria-label="القوائم"><button type="button" class="chip" data-list="all" aria-pressed="${listFilter === "all"}">الكل</button>${LIST_KEYS.map(k => `<button type="button" class="chip" data-list="${k}" aria-pressed="${listFilter === k}"><i class="dot" style="--c:var(--c-${k})"></i>${LISTS[k]}</button>`).join("")}</div>`;
  const tk = today();
  const late = pool.filter(t => !t.done && t.day && t.day < tk).sort(byTime);
  const tod = pool.filter(t => !t.done && t.day === tk).sort(byTime);
  const up = pool.filter(t => !t.done && t.day && t.day > tk).sort((a, b) => a.day.localeCompare(b.day) || byTime(a, b));
  const some = pool.filter(t => !t.done && !t.day).sort(byTime);
  const done = pool.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 30);
  let h = chips;
  if (!late.length && !tod.length && !up.length && !some.length) h += `<div class="empty">${emptyArt()}<h2 class="empty__title">ما فيه مهام هنا</h2><p class="empty__text">مهام هذي القائمة تظهر هنا.</p><button type="button" class="btn btn--primary" data-act="new-task">${I.plusSm}إضافة مهمة</button></div>`;
  if (late.length) h += section("متأخرة", `<ul class="list">${late.map(t => row(t)).join("")}</ul>`, { count: late.length });
  if (tod.length) h += section("اليوم", `<ul class="list">${tod.map(t => row(t)).join("")}</ul>`, { count: tod.length });
  if (up.length) h += section("القادم", `<ul class="list">${up.map(t => row(t, { day: true })).join("")}</ul>`, { count: up.length });
  if (some.length) h += section("بدون موعد", `<ul class="list">${some.map(t => row(t)).join("")}</ul>`, { count: some.length });
  if (done.length) h += `<section class="section"><button type="button" class="disclosure" data-act="showdone" aria-expanded="${showDone}">${I.chev}<span>المنجزة (${N(done.length)})</span></button>${showDone ? `<ul class="list">${done.map(t => row(t, { day: true })).join("")}</ul>` : ""}</section>`;
  el.innerHTML = h;
}

/* ---------- notes ---------- */
function noteGrid(cards) {
  const cols = innerWidth >= 960 ? 3 : 2;
  const c = Array.from({ length: cols }, () => []);
  cards.forEach((h, i) => c[i % cols].push(h));
  return `<div class="notes" style="--cols:${cols}">${c.map(x => `<div class="notes__col">${x.join("")}</div>`).join("")}</div>`;
}
function noteCard(n) {
  return `<button type="button" class="note" data-note="${n.id}">${n.pinned ? `<span class="note__pin">${I.pinFill}</span>` : ""}<span class="note__title">${esc(n.title || "بدون عنوان")}</span>${n.body ? `<span class="note__body">${esc(n.body)}</span>` : ""}<span class="note__date num">${esc(ago(n.updated))}</span></button>`;
}
function renderNotes() {
  const el = $("#view-notes");
  const q = noteQuery.trim();
  const list = S.notes.filter(n => !q || (n.title + " " + n.body).includes(q)).sort((a, b) => b.updated - a.updated);
  const pinned = list.filter(n => n.pinned), rest = list.filter(n => !n.pinned);
  let h = `<div class="search">${I.search}<label class="sr" for="noteSearch">بحث في الملاحظات</label><input class="field" id="noteSearch" type="search" placeholder="بحث في الملاحظات" value="${esc(noteQuery)}"></div>`;
  if (!S.notes.length) { el.innerHTML = h + `<div class="empty">${emptyArt()}<h2 class="empty__title">ما فيه ملاحظات</h2><p class="empty__text">مكان للأفكار ومحاضر الاجتماعات والقوائم.</p><button type="button" class="btn btn--primary" data-act="new-note">${I.plusSm}ملاحظة جديدة</button></div>`; return; }
  if (!list.length) { el.innerHTML = h + `<div class="empty empty--flat"><p class="empty__text">ما فيه نتائج لـ «${esc(q)}».</p></div>`; return; }
  if (pinned.length) h += section("مثبتة", noteGrid(pinned.map(noteCard)), { count: pinned.length });
  h += section(pinned.length ? "الكل" : "آخر الملاحظات", noteGrid([`<button type="button" class="note note--new" data-act="new-note">${I.plus}<span>ملاحظة جديدة</span></button>`, ...rest.map(noteCard)]));
  el.innerHTML = h;
}

/* ---------- prefs ---------- */
function renderPrefs() {
  const doneCount = S.tasks.filter(t => t.done).length;
  const seg = (name, val, opts) => `<div class="seg" role="radiogroup" aria-label="${name}">${opts.map(([v, l]) => `<button type="button" role="radio" aria-checked="${val === v}" data-set="${name}" data-val="${v}">${l}</button>`).join("")}</div>`;
  const cr = (text, kind) => `<div class="confirm" role="alert"><p>${text}</p><div><button type="button" class="btn btn--ghost btn--sm" data-act="cancel-confirm">إلغاء</button><button type="button" class="btn btn--primary btn--sm" data-act="do-${kind}">حذف</button></div></div>`;
  $("#view-prefs").innerHTML = `
  ${section("المظهر", `<div class="card"><div class="setting"><div class="setting__row"><span class="setting__title">الوضع</span><span class="setting__hint">التلقائي يتبع الجهاز</span></div>${seg("theme", S.settings.theme, [["auto", "تلقائي"], ["light", "نهاري"], ["dark", "ليلي"]])}</div>
    <div class="setting"><div class="setting__row"><span class="setting__title">الأرقام</span><span class="setting__hint">في كل التطبيق</span></div>${seg("digits", S.settings.digits, [["arab", "عربية ١٢٣"], ["latn", "إنجليزية 123"]])}</div></div>`)}
  ${section("التذكيرات", `<div class="card"><p class="note-line">${I.bellSm}<span>التذكير يظهر كإشعار داخل التطبيق في وقته، طالما التطبيق مفتوح على أي جهاز.</span></p></div>`)}
  ${section("البيانات", `<div class="card">
    <button type="button" class="row-btn" data-act="clear-done" ${doneCount ? "" : "disabled"}><span class="row-btn__icon">${I.broom}</span><span class="row-btn__text"><span class="setting__title">حذف المهام المنجزة</span><span class="setting__hint">${doneCount ? tasksW(doneCount) + " منجزة" : "ما فيه مهام منجزة"}</span></span></button>
    ${confirmKind === "clear-done" ? cr("بتنحذف " + tasksW(doneCount) + " منجزة.", "clear-done") : ""}
    <button type="button" class="row-btn" data-act="replay"><span class="row-btn__icon">${I.replay}</span><span class="row-btn__text"><span class="setting__title">شاشة الترحيب</span><span class="setting__hint">عرضها مرة ثانية</span></span></button>
    <button type="button" class="row-btn row-btn--danger" data-act="reset" ${S.tasks.length || S.notes.length ? "" : "disabled"}><span class="row-btn__icon">${I.trash}</span><span class="row-btn__text"><span class="setting__title">حذف كل البيانات</span><span class="setting__hint">المهام والملاحظات، ولا يمكن التراجع</span></span></button>
    ${confirmKind === "reset" ? cr("بتنحذف كل المهام والملاحظات.", "reset") : ""}
  </div>`)}
  <p class="setting__hint num" style="text-align:center">مهام · الإصدار ${N("3.0").replace(".", digits() === "arab" ? "٫" : ".")}</p>`;
}

/* ---------- side panel ---------- */
function upcomingReminders(onlyDay) {
  const now = Date.now();
  return S.tasks.filter(t => !t.done && t.remind != null && t.day && t.time && (!onlyDay || t.day === onlyDay))
    .map(t => ({ t, at: tDate(t.time, t.day).getTime() - t.remind * 60000 }))
    .filter(x => x.at >= now - 60000 || (!x.t.reminded && x.at >= now - 6 * 3600e3))
    .sort((a, b) => a.at - b.at);
}
function renderSide() {
  const el = $("#side"); if (getComputedStyle(el).display === "none") return;
  const rems = upcomingReminders().slice(0, 4);
  const pins = S.notes.filter(n => n.pinned).concat(S.notes.filter(n => !n.pinned).sort((a, b) => b.updated - a.updated)).slice(0, 3);
  el.innerHTML = `${view === "calendar" ? "" : monthGrid(calMonth, { mini: true })}
  <div class="side__block side__block--tight"><p class="side__title" style="margin-bottom:var(--s-2)">التذكيرات القادمة</p>${rems.length ? rems.map(({ t, at }) => `<button type="button" class="rem" data-id="${t.id}" data-act="edit"><span class="rem__icon">${I.bellSm}</span><span style="min-width:0"><b>${esc(t.title)}</b><span class="num">${esc(dayLabel(t.day))} · ${esc(fmt(new Date(at), { hour: "numeric", minute: "2-digit" }))}</span></span></button>`).join("") : `<p class="setting__hint" style="padding-inline:4px">ما فيه تذكيرات قادمة.</p>`}</div>
  <div class="side__block"><p class="side__title">ملاحظات <button type="button" class="link" data-view="notes">الكل</button></p>${pins.length ? pins.map(n => `<button type="button" class="side-note" data-note="${n.id}"><b>${esc(n.title || "بدون عنوان")}</b><span>${esc(n.body)}</span></button>`).join("") : `<button type="button" class="side-note" data-act="new-note"><b>+ ملاحظة جديدة</b><span>للأفكار ومحاضر الاجتماعات</span></button>`}</div>`;
}

/* ================= Actions ================= */
const find = id => S.tasks.find(t => t.id === id);
function toggle(id, el) {
  const t = find(id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
  persist();
  if (el) {
    const c = el.querySelector(".check"); if (c) c.setAttribute("aria-checked", String(t.done));
    el.classList.toggle("is-done", t.done);
    setTimeout(() => { if (!el.classList.contains("ev")) el.classList.add("is-leaving"); setTimeout(render, 220); }, 380);
  } else render();
  if (t.done) toast("تمت المهمة", () => { t.done = false; t.doneAt = null; persist(); render(); });
}

/* ================= Toast & reminder banner ================= */
let toastT = null, toastUndo = null;
function toast(text, undo) {
  $("#toastText").textContent = text; toastUndo = undo || null;
  $("#toastAction").hidden = !undo; $("#toast").classList.toggle("no-action", !undo);
  $("#toast").classList.add("is-on"); clearTimeout(toastT); toastT = setTimeout(() => $("#toast").classList.remove("is-on"), 3600);
}
$("#toastAction").addEventListener("click", () => { if (toastUndo) toastUndo(); toastUndo = null; $("#toast").classList.remove("is-on"); });
let bannerTask = null;
function showBanner(t) {
  bannerTask = t;
  $("#banner").innerHTML = `<span class="banner__icon">${I.bellLg}</span><span class="banner__text"><b>${esc(t.title)}</b><span class="num">${t.remind ? "بعد " + esc(REMINDS.find(r => r[0] === t.remind)[1].replace("قبل ", "")) + " · " : ""}${esc(fmtT(t.time))}${t.list ? " · " + LISTS[t.list] : ""}</span></span>
    <span class="banner__actions"><button type="button" class="btn btn--sm btn--line" data-b="snooze">بعد ١٠ دقائق</button><button type="button" class="btn btn--sm btn--primary" data-b="done">تم</button><button type="button" class="btn btn--sm btn--ghost" data-b="close">إغلاق</button></span>`;
  $("#banner").classList.add("is-on");
}
$("#banner").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !bannerTask) return;
  if (b.dataset.b === "done") { bannerTask.done = true; bannerTask.doneAt = Date.now(); }
  if (b.dataset.b === "snooze") { bannerTask.snooze = Date.now() + 10 * 60000; bannerTask.reminded = false; }
  persist(); $("#banner").classList.remove("is-on"); bannerTask = null; render();
});
function checkReminders() {
  if (bannerTask) return;
  const now = Date.now();
  const due = S.tasks.find(t => !t.done && t.remind != null && t.day && t.time && !t.reminded && (() => { const at = t.snooze || (tDate(t.time, t.day).getTime() - t.remind * 60000); return now >= at && now - at < 6 * 3600e3; })());
  if (due) { due.reminded = true; due.snooze = null; persist(); showBanner(due); }
}

/* ================= Task sheet ================= */
const layer = $("#layer"), sheet = $("#sheet");
let draft = null, mode = null, lastFocus = null;
function openLayer() {
  lastFocus = document.activeElement; layer.hidden = false; layer.classList.remove("is-closing");
  requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add("is-open")));
}
function closeSheet() {
  if (layer.hidden) return;
  if (mode === "note") commitNote();
  layer.classList.remove("is-open"); layer.classList.add("is-closing");
  setTimeout(() => { layer.hidden = true; layer.classList.remove("is-closing"); sheet.classList.remove("sheet--note"); draft = null; mode = null; }, 220);
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  render();
}
function openTask(t, preset = {}) {
  mode = "task";
  draft = t ? { ...t } : { id: null, title: "", note: "", day: preset.day ?? today(), time: preset.time || "", dur: 30, list: preset.list || (listFilter !== "all" ? listFilter : "work"), remind: null, prio: false };
  sheet.classList.remove("sheet--note"); renderTaskSheet(); openLayer();
  setTimeout(() => { const i = $("#f-title"); if (i) { i.focus({ preventScroll: true }); i.setSelectionRange(i.value.length, i.value.length); } }, 60);
}
function renderTaskSheet() {
  const d = draft, tk = today(), tm = tomorrow();
  const custom = d.day && d.day !== tk && d.day !== tm;
  const chip = (attr, val, label, on, cls = "") => `<button type="button" class="chip ${cls}" ${attr}="${val}" aria-pressed="${on}">${label}</button>`;
  sheet.innerHTML = `
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet__head"><h2 class="sheet__title" id="sheetTitle">${d.id ? "تعديل المهمة" : "مهمة جديدة"}</h2><button type="button" class="icon-btn" data-s="close" aria-label="إغلاق">${I.close}</button></div>
    <div class="sheet__inputs">
      <label class="sr" for="f-title">اسم المهمة</label><input class="bare t1" id="f-title" maxlength="140" placeholder="اسم المهمة" value="${esc(d.title)}" enterkeyhint="done">
      <label class="sr" for="f-note">ملاحظة</label><input class="bare t2" id="f-note" maxlength="200" placeholder="تفاصيل (اختياري)" value="${esc(d.note || "")}">
    </div>
    <div class="sheet__grid">
      <div class="sheet__section wide"><span class="label">الموعد</span><div class="chips">
        ${chip("data-day", tk, "اليوم", d.day === tk)}${chip("data-day", tm, "بكرة", d.day === tm)}
        <span class="chip" aria-pressed="${!!custom}">${I.calSm}<span class="num">${custom ? esc(dayLabel(d.day)) : "تاريخ آخر"}</span><input type="date" id="f-date" aria-label="اختيار تاريخ" value="${custom ? d.day : ""}"></span>
        ${chip("data-day", "", "بدون موعد", !d.day)}</div></div>
      <div class="sheet__section"><span class="label">الوقت</span><div class="chips">
        <span class="chip" aria-pressed="${!!d.time}">${I.clockSm}<span class="num">${d.time ? esc(fmtT(d.time)) : "بدون وقت"}</span><input type="time" id="f-time" aria-label="اختيار الوقت" value="${d.time || ""}" ${d.day ? "" : "disabled"}></span>
        ${d.time ? `<button type="button" class="icon-btn icon-btn--sm" data-s="clear-time" aria-label="إزالة الوقت">${I.close}</button>` : ""}</div></div>
      ${d.time ? `<div class="sheet__section"><span class="label">المدة</span><div class="chips">${DURS.map(([v, l]) => chip("data-dur", v, N(l), d.dur === v)).join("")}</div></div>` : ""}
      ${d.time ? `<div class="sheet__section wide"><span class="label">التذكير</span><div class="chips">${REMINDS.map(([v, l]) => chip("data-remind", v ?? "none", (v != null ? I.bellSm : "") + N(l), d.remind === v, "chip--remind")).join("")}</div></div>` : ""}
      <div class="sheet__section wide"><span class="label">القائمة</span><div class="chips">${LIST_KEYS.map(k => chip("data-l", k, `<i class="dot" style="--c:var(--c-${k})"></i>${LISTS[k]}`, d.list === k)).join("")}</div></div>
    </div>
    <div class="sheet__foot">
      ${d.id ? `<button type="button" class="btn btn--danger" data-s="delete">${I.trash}حذف</button>` : ""}
      <button type="submit" class="btn btn--primary" id="f-submit" ${d.title.trim() || (d.note || "").trim() ? "" : "disabled"}>${d.id ? "حفظ" : "إضافة"}</button>
    </div>`;
}

/* ================= Note sheet ================= */
function openNote(n) {
  mode = "note";
  draft = n ? { ...n } : { id: null, title: "", body: "", pinned: false };
  sheet.classList.add("sheet--note");
  sheet.innerHTML = `
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet__head"><h2 class="sheet__title" id="sheetTitle">${n ? "ملاحظة" : "ملاحظة جديدة"}</h2>
      <span style="display:flex;gap:4px"><button type="button" class="icon-btn" data-s="pin" aria-pressed="${!!draft.pinned}" aria-label="${draft.pinned ? "إلغاء التثبيت" : "تثبيت"}" style="${draft.pinned ? "color:var(--accent)" : ""}">${draft.pinned ? I.pinFill : I.pin}</button>${n ? `<button type="button" class="icon-btn" data-s="note-delete" aria-label="حذف">${I.trash}</button>` : ""}<button type="button" class="icon-btn" data-s="close" aria-label="إغلاق">${I.close}</button></span></div>
    <label class="sr" for="n-title">العنوان</label><input class="bare t1" id="n-title" maxlength="120" placeholder="العنوان" value="${esc(draft.title)}">
    <p class="sheet__stamp num">${n ? "آخر تعديل " + esc(ago(n.updated)) : "تنحفظ تلقائياً"}</p>
    <label class="sr" for="n-body">الملاحظة</label><textarea class="bare" id="n-body" placeholder="نص الملاحظة">${esc(draft.body)}</textarea>
    <div class="sheet__foot"><button type="button" class="btn btn--primary" data-s="close">تم</button></div>`;
  openLayer();
  setTimeout(() => { const i = n ? $("#n-body") : $("#n-title"); i && i.focus({ preventScroll: true }); }, 60);
}
function commitNote() {
  if (!draft) return;
  const title = (draft.title || "").trim(), body = (draft.body || "").trim();
  if (!draft.id) { if (!title && !body) return; draft.id = uid(); S.notes.push({ id: draft.id, title, body, pinned: !!draft.pinned, created: Date.now(), updated: Date.now() }); }
  else { const n = S.notes.find(x => x.id === draft.id); if (!n) return; if (n.title === title && n.body === body && !!n.pinned === !!draft.pinned) return; Object.assign(n, { title, body, pinned: !!draft.pinned, updated: Date.now() }); }
  persist();
}

sheet.addEventListener("input", e => {
  if (!draft) return;
  const id = e.target.id;
  if (id === "f-title") draft.title = e.target.value;
  if (id === "f-note") draft.note = e.target.value;
  if (id === "f-title" || id === "f-note") $("#f-submit").disabled = !(draft.title.trim() || (draft.note || "").trim());
  if (id === "n-title") draft.title = e.target.value;
  if (id === "n-body") draft.body = e.target.value;
});
sheet.addEventListener("change", e => {
  if (e.target.id === "f-date" && e.target.value) { draft.day = e.target.value; renderTaskSheet(); }
  if (e.target.id === "f-time") { draft.time = e.target.value; renderTaskSheet(); }
});
sheet.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !draft) return;
  if (b.dataset.day !== undefined) { draft.day = b.dataset.day || null; if (!draft.day) { draft.time = ""; draft.remind = null; } renderTaskSheet(); return; }
  if (b.dataset.dur) { draft.dur = +b.dataset.dur; renderTaskSheet(); return; }
  if (b.dataset.remind) { draft.remind = b.dataset.remind === "none" ? null : +b.dataset.remind; draft.reminded = false; renderTaskSheet(); return; }
  if (b.dataset.l) { draft.list = b.dataset.l; renderTaskSheet(); return; }
  const s = b.dataset.s;
  if (s === "close") closeSheet();
  if (s === "clear-time") { draft.time = ""; draft.remind = null; renderTaskSheet(); }
  if (s === "delete") { const t = find(draft.id), i = S.tasks.indexOf(t); S.tasks.splice(i, 1); persist(); draft = null; mode = null; closeSheet(); toast("انحذفت المهمة", () => { S.tasks.splice(i, 0, t); persist(); render(); }); }
  if (s === "pin") { draft.pinned = !draft.pinned; b.setAttribute("aria-pressed", String(draft.pinned)); b.innerHTML = draft.pinned ? I.pinFill : I.pin; b.style.color = draft.pinned ? "var(--accent)" : ""; }
  if (s === "note-delete") { const n = S.notes.find(x => x.id === draft.id), i = S.notes.indexOf(n); S.notes.splice(i, 1); persist(); draft = null; mode = null; closeSheet(); toast("انحذفت الملاحظة", () => { S.notes.splice(i, 0, n); persist(); render(); }); }
});
sheet.addEventListener("submit", async e => {
  e.preventDefault(); if (mode !== "task") return;
  let title = draft.title.trim(), note = (draft.note || "").trim();
  if (!title && note) { title = note; note = ""; }
  if (!title) return;
  $("#f-submit").classList.add("is-loading");
  const fields = { title, note, day: draft.day, time: draft.day ? draft.time || "" : "", dur: draft.dur || 30, list: draft.list, remind: draft.time ? draft.remind : null };
  const isNew = !draft.id;
  if (isNew) S.tasks.push({ id: uid(), ...fields, done: false, doneAt: null, reminded: false, created: Date.now() });
  else { const t = find(draft.id); const changedTime = t.time !== fields.time || t.day !== fields.day || t.remind !== fields.remind; Object.assign(t, fields); if (changedTime) { t.reminded = false; t.snooze = null; } }
  persist(); await wait(remoteRef ? 240 : 100);
  const day = fields.day; draft = null; mode = null; closeSheet();
  if (isNew) toast(day && day !== today() ? `انضافت لـ${dayLabel(day)}` : !day ? "انضافت بدون موعد" : "انضافت لليوم");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !layer.hidden) { e.preventDefault(); closeSheet(); return; }
  if (!layer.hidden && e.key === "Tab") {
    const f = [...sheet.querySelectorAll("button:not(:disabled), input:not(:disabled), textarea")].filter(x => x.offsetParent !== null);
    if (f.length) { if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); } }
  }
  const typing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
  if (typing || !layer.hidden || !onbEl.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "n" || e.key === "N" || e.key === "ى") { e.preventDefault(); openTask(null, { day: view === "calendar" && calSel ? calSel : today() }); }
  if (e.key === "m" || e.key === "M" || e.key === "ة") { e.preventDefault(); openNote(null); }
});
$("#scrim").addEventListener("click", closeSheet);

/* ================= Global clicks ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.closest("#sheet") || b.closest("#onb") || b.closest("#toast") || b.closest("#banner")) return;
  if (b.dataset.view) { if (b.dataset.view === "tasks" && !b.dataset.list) listFilter = listFilter; setView(b.dataset.view); return; }
  if (b.dataset.list) { listFilter = b.dataset.list; showDone = false; if (view !== "tasks") setView("tasks"); else render(); return; }
  if (b.dataset.day) { calSel = b.dataset.day; const d = dateOf(calSel); if (d.getMonth() !== calMonth.getMonth()) calMonth = new Date(d.getFullYear(), d.getMonth(), 1); if (view !== "calendar") setView("calendar"); else render(); return; }
  if (b.dataset.note) { openNote(S.notes.find(n => n.id === b.dataset.note)); return; }
  if (b.dataset.set) { S.settings[b.dataset.set] = b.dataset.val; persist(); applySettings(); render(); return; }
  const a = b.dataset.act, holder = b.closest("[data-id]"), id = (b.dataset.id) || (holder && holder.dataset.id);
  if (a === "toggle" && id) toggle(id, b.closest(".row, .ev"));
  else if (a === "edit" && id) openTask(find(id));
  else if (a === "new-task") openTask(null, { day: b.dataset.day || (view === "calendar" && calSel ? calSel : today()) });
  else if (a === "new-note") openNote(null);
  else if (a === "showdone") { showDone = !showDone; render(); }
  else if (a === "cal-prev") { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); render(); }
  else if (a === "cal-next") { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); render(); }
  else if (a === "cal-today") { const d = new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); calSel = today(); render(); }
  else if (a === "clear-done" || a === "reset") { confirmKind = confirmKind === a ? null : a; render(); }
  else if (a === "cancel-confirm") { confirmKind = null; render(); }
  else if (a === "do-clear-done") { const n = S.tasks.filter(t => t.done).length; S.tasks = S.tasks.filter(t => !t.done); confirmKind = null; persist(); render(); toast(`انحذفت ${tasksW(n)}`); }
  else if (a === "do-reset") { S.tasks = []; S.notes = []; confirmKind = null; persist(); render(); toast("انحذفت كل البيانات"); }
  else if (a === "replay") openOnboarding();
});
document.addEventListener("input", e => { if (e.target.id === "noteSearch") { noteQuery = e.target.value; const pos = e.target.selectionStart; renderNotes(); const i = $("#noteSearch"); i.focus(); i.setSelectionRange(pos, pos); } });

/* ================= Onboarding ================= */
let slide = 0;
const SLIDES = [
  { title: "يومك كله في مكان واحد", text: "مهامك ومواعيدك وملاحظاتك، مرتبة حسب اليوم والقائمة.",
    art: () => `<div class="art-stack">
      <div style="inset-inline-start:0;top:10px;width:170px;transform:rotate(3deg)"><div class="art-chk"><i class="on"></i><span class="art-line" style="width:90px;background:var(--line-strong)"></span></div><div class="art-chk"><i></i><span class="art-line" style="width:110px"></span></div><div class="art-chk"><i></i><span class="art-line" style="width:70px"></span></div></div>
      <div style="inset-inline-end:0;top:0;width:150px;transform:rotate(-4deg)"><span class="art-line" style="width:60px;background:var(--accent)"></span><div class="art-cal">${Array.from({ length: 21 }, (_, i) => `<i class="${i === 9 ? "t" : i === 12 || i === 16 ? "d" : ""}"></i>`).join("")}</div></div>
      <div style="inset-inline-start:60px;bottom:0;width:180px;transform:rotate(-1deg)"><span class="art-line" style="width:100px;background:var(--text)"></span><span class="art-line"></span><span class="art-line" style="width:80%"></span></div></div>` },
  { title: "اليوم كله بنظرة", text: "شريط واحد يعرض مواعيد اليوم من الصبح لليل، مع الوقت الحالي.",
    art: () => `<div class="art-ribbon"><div class="ribbon__head"><b>يومك</b><span>التالي ١١:٠٠ ص</span></div><div class="ribbon__track">
      <i class="blk" style="--c:var(--c-work);inset-inline-start:16%;width:9%"></i><i class="blk" style="--c:var(--c-work);inset-inline-start:30%;width:6%"></i><i class="blk" style="--c:var(--c-personal);inset-inline-start:48%;width:5%"></i><i class="blk" style="--c:var(--c-health);inset-inline-start:69%;width:8%"></i><i class="blk" style="--c:var(--c-home);inset-inline-start:84%;width:6%"></i><i class="now" style="inset-inline-start:24%"></i></div>
      <div class="ribbon__hours"><span>٦</span><span>٩</span><span>١٢</span><span>٣</span><span>٦</span><span>٩</span><span>١٢</span></div></div>` },
  { title: "تذكير في وقته", text: "التذكير يظهر قبل الموعد بالوقت المختار، ومنه تأجيل المهمة أو إنهاؤها.",
    art: () => `<div class="art-banner"><div class="banner"><span class="banner__icon">${I.bellLg}</span><span class="banner__text"><b>اجتماع فريق التصميم</b><span>بعد ١٠ د · ١:٣٠ م · العمل</span></span><span class="banner__actions"><span class="btn btn--sm btn--line">بعد ١٠ دقائق</span><span class="btn btn--sm btn--primary">تم</span></span></div></div>` },
];
function openOnboarding() { slide = 0; onbEl.hidden = false; onbEl.classList.remove("is-leaving"); renderOnb(); }
function closeOnboarding(silent) { S.onboarded = true; if (!silent) persist(); onbEl.classList.add("is-leaving"); setTimeout(() => { onbEl.hidden = true; onbEl.classList.remove("is-leaving"); }, silent ? 0 : 300); render(); }
function onbChrome() {
  const last = slide === SLIDES.length, filled = $("#firstInput") && $("#firstInput").value.trim();
  return {
    top: `<span class="onb__brand"><img src="${ICON_URI}" alt="">مهام</span>${last ? `<button type="button" class="btn btn--ghost btn--sm" data-o="back">رجوع</button>` : `<button type="button" class="btn btn--ghost btn--sm" data-o="skip">تخطي</button>`}`,
    foot: `${last ? "" : `<div class="dots" aria-hidden="true">${SLIDES.map((_, i) => `<span class="${i === slide ? "on" : ""}"></span>`).join("")}</div>`}${last ? `<button type="submit" form="firstForm" class="btn btn--primary btn--block" id="firstBtn" ${filled ? "" : "disabled"}>إضافة</button>` : `<button type="button" class="btn btn--primary btn--block" data-o="next">${slide === SLIDES.length - 1 ? "متابعة" : "التالي"}</button>`}`,
  };
}
function renderOnb() {
  const last = slide === SLIDES.length;
  onbEl.innerHTML = `<div class="onb__top"></div><div class="onb__stage">
    ${SLIDES.map((s, i) => `<section class="slide ${i < slide ? "is-before" : ""}" aria-hidden="${i !== slide}"><div class="slide__art">${s.art()}</div><div class="slide__copy"><h2 class="slide__title">${s.title}</h2><p class="slide__text">${s.text}</p></div></section>`).join("")}
    <section class="slide" aria-hidden="${!last}"><form class="first" id="firstForm" autocomplete="off">
      <div class="slide__copy" style="justify-self:center"><h2 class="slide__title">أول مهمة</h2><p class="slide__text">الوقت والتذكير تقدر تضيفها بعدين.</p></div>
      <div style="display:grid;gap:12px"><label class="sr" for="firstInput">أول مهمة</label><input class="field" id="firstInput" maxlength="140" placeholder="مثلاً: إرسال التقرير الأسبوعي" enterkeyhint="done">
      <div class="chips">${["الرد على الإيميلات", "حجز موعد", "أغراض البيت"].map(s => `<button type="button" class="chip" data-o="suggest">${s}</button>`).join("")}</div></div>
    </form></section></div><div class="onb__foot"></div>`;
  const c = onbChrome(); onbEl.querySelector(".onb__top").innerHTML = c.top; onbEl.querySelector(".onb__foot").innerHTML = c.foot;
}
function goSlide() {
  const last = slide === SLIDES.length;
  onbEl.querySelectorAll(".slide").forEach((s, i) => { s.classList.toggle("is-before", i < slide); s.setAttribute("aria-hidden", String(i !== slide)); });
  const c = onbChrome(); onbEl.querySelector(".onb__top").innerHTML = c.top; onbEl.querySelector(".onb__foot").innerHTML = c.foot;
  if (last) setTimeout(() => $("#firstInput").focus({ preventScroll: true }), 340);
}
onbEl.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const o = b.dataset.o;
  if (o === "next") { slide++; goSlide(); }
  if (o === "back") { slide = SLIDES.length - 1; goSlide(); }
  if (o === "skip") { slide = SLIDES.length; goSlide(); }
  if (o === "suggest") { const i = $("#firstInput"); i.value = b.textContent; $("#firstBtn").disabled = false; i.focus(); }
});
onbEl.addEventListener("input", e => { if (e.target.id === "firstInput") $("#firstBtn").disabled = !e.target.value.trim(); });
onbEl.addEventListener("submit", e => {
  e.preventDefault(); const v = $("#firstInput").value.trim(); if (!v) return;
  S.tasks.push({ id: uid(), title: v, note: "", day: today(), time: "", dur: 30, list: "work", remind: null, done: false, doneAt: null, reminded: false, created: Date.now() });
  view = "today"; closeOnboarding(); toast("انضافت المهمة");
});
let tsx = null;
onbEl.addEventListener("touchstart", e => { tsx = e.touches[0].clientX; }, { passive: true });
onbEl.addEventListener("touchend", e => { if (tsx == null) return; const dx = e.changedTouches[0].clientX - tsx; tsx = null; if (Math.abs(dx) < 50) return; if (dx < 0 && slide < SLIDES.length) { slide++; goSlide(); } if (dx > 0 && slide > 0) { slide--; goSlide(); } });

/* ================= Boot ================= */
function boot() {
  document.documentElement.lang = "ar"; document.documentElement.dir = "rtl";
  const local = loadLocal(); if (local) hydrate(local);
  applySettings();
  document.querySelectorAll(".js-icon").forEach(i => i.src = ICON_URI);
  const fav = svgURI(iconSVG(180)); $("#favicon").href = fav; $("#touchicon").href = fav;
  const h = location.hash.slice(1); if ([...VIEWS.map(v => v.id), "prefs"].includes(h)) view = h;
  render();
  if (!S.onboarded) openOnboarding();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applySettings);
  addEventListener("resize", () => renderSide());
  let lastDay = today(), lastMin = new Date().getMinutes();
  setInterval(() => { const m = new Date().getMinutes(); if (today() !== lastDay || (m !== lastMin && view === "today" && layer.hidden)) { lastDay = today(); lastMin = m; if (layer.hidden) render(); } checkReminders(); }, 15000);
  setTimeout(checkReminders, 1500);
  connectRemote();
}
window.__maham = { get state() { return S; }, render, setView, showBanner: id => showBanner(find(id)) };
boot();
})();
</script>
</body></html>
